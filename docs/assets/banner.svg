  <text x="82" y="193" fill="#fffaf0" font-family="Georgia,Times New Roman,serif" font-size="75" font-weight="600">Local Knowledge</text>
  <text x="82" y="272" fill="#fffaf0" font-family="Georgia,Times New Roman,serif" font-size="75" font-weight="600">Terminal</text>
  <text x="86" y="327" fill="#b8c9c0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Private, book-grounded intelligence on your own hardware.</text>
  <g transform="translate(86 371)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">
    <text fill="#f0966f">EN</text><text x="52" fill="#aad9c1">日本語</text><text x="138" fill="#e9d29e">中文 · PINYIN · RUBY</text>
